packages:
  - 'apps/*'
  - 'packages/*'

supportedArchitectures:
  os:
    - current
    - linux
    - darwin
  cpu:
    - current
    - x64
    - arm64

saveExact: true
progress: false

# 単位は分。7 日。Renovate 側の minimumReleaseAge と揃えている
minimumReleaseAge: 10080

allowBuilds:
  esbuild: true
  workerd: true
  lefthook: true
  # drizzle-orm / better-auth の optional peer として入るだけで、
  # このリポジトリは libsql しか使わないためビルドは不要
  '@prisma/client': false
  better-sqlite3: false
